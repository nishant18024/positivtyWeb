<div class="min-h-screen bg-[#faf7f2] flex items-center justify-center py-20 px-4 pt-48">
    <div class="bg-white rounded-[40px] p-12 md:p-16 max-w-3xl w-full shadow-[0_4px_24px_rgba(0,0,0,0.06)] text-center">

        <!-- Red Concentric Circle Icon -->
        <div class="h-28 w-28 bg-[#f5a399] rounded-full mx-auto mb-8 flex items-center justify-center">
            <div class="h-24 w-24 bg-[#e74c3c] rounded-full"></div>
        </div>

        <!-- Title -->
        <h2 class="font-playfair text-3xl text-black font-bold mb-6 tracking-wide uppercase">
            Payment Unsuccessful!
        </h2>

        <!-- Description -->
        <p class="text-[#7b5a4a] text-lg font-medium opacity-90 mb-10">
            We're sorry, something didn't work right this time. Please try again.
        </p>

        <!-- Home Button -->
        <div class="flex justify-center mb-12">
            <button (click)="goToHome()"
                class="bg-[#836054] text-white py-4 px-16 rounded-[30px] font-bold text-lg uppercase hover:bg-[#6b4e43] transition-colors shadow-md border-2 border-transparent">
                HOME
            </button>
        </div>

        <!-- Support Text -->
        <p class="text-[#7b5a4a] text-lg font-medium opacity-90 mt-8">
            &ldquo;Need help? Drop us a note at <a href="mailto:support@positivty.com"
                class="underline decoration-1 underline-offset-4 pointer">support&#64;positivty.com</a>&rdquo;
        </p>
    </div>
</div>
