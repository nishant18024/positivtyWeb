<section>
  <!-- Hero Section -->
  <div class="relative bg-cover bg-center h-[400px] lg:h-[500px] flex items-center" style="
      background-image: url(&quot;https://positivtystaticassets.blob.core.windows.net/images/contactus/banner-contact.jpg&quot;);
      background-size: cover;
      background-position: center center;
    ">
    <div class="absolute inset-0 bg-gradient-to-r from-[#E5C3A1] via-[#FED591] to-transparent"></div>

    <div class="relative max-w-7xl mx-auto px-6 py-16 flex flex-col md:flex-row items-center justify-between">
      <div class="max-w-lg">
        <h2 class="text-3xl md:text-4xl font-extrabold text-[#0A0A0A] mb-3">
          Get in Touch With Us
        </h2>
        <p class="text-sm md:text-base font-semibold text-[#363636]">
          We’re here to help and answer any question you might have.
        </p>
      </div>
    </div>
  </div>

  <!-- Info Cards -->
  <div class="max-w-7xl mx-auto px-6 mt-12 relative z-10 grid md:grid-cols-2 gap-6">
    <div class="bg-[#F6F4EF] p-6 rounded-md shadow-sm flex gap-4">
      <div class="w-16 h-16 bg-[#836054] flex items-center justify-center rounded-md">
        <img src="https://positivtystaticassets.blob.core.windows.net/images/contactus/support-icon.png" class="w-8" />
      </div>
      <div>
        <h4 class="font-bold text-base text-[#0A0A0A]">
          Support Hours and Availability
        </h4>
        <p class="text-sm text-[#363636C2] mt-1">
          Our team is here to help you with any questions or issues.
        </p>
      </div>
    </div>

    <div class="bg-[#F6F4EF] p-6 rounded-md shadow-sm flex gap-4">
      <div class="w-16 h-16 bg-[#836054] flex items-center justify-center rounded-md">
        <img src="https://positivtystaticassets.blob.core.windows.net/images/contactus/time-icon.png" class="w-8" />
      </div>
      <div>
        <h4 class="font-bold text-base text-[#0A0A0A]">Support Hours</h4>
        <p class="text-sm text-[#363636C2] mt-1">
          Monday to Saturday, 9:30 AM – 6:30 PM IST.
        </p>
      </div>
    </div>
  </div>

  <!-- Contact Form Section -->
  <div class="max-w-7xl mx-auto px-6 mt-12">
    <div class="bg-white rounded-xl shadow-lg p-8 grid lg:grid-cols-2 gap-10">
      <!-- Left Image -->
      <div>
        <img src="https://positivtystaticassets.blob.core.windows.net/images/contactus/support-agent.png"
          class="w-full rounded-lg" />
      </div>

      <!-- Form -->
      <div>
        <form class="space-y-4">
          <!-- Category -->
          <select class="w-full bg-[#F6F4EF] rounded-md p-3 text-sm text-[#836054] focus:outline-none">
            <option>Select Category</option>
            <option>General Inquiry</option>
            <option>Technical Support</option>
            <option>Billing</option>
          </select>

          <!-- Subcategory -->
          <select class="w-full bg-[#F6F4EF] rounded-md p-3 text-sm text-[#836054] focus:outline-none">
            <option>Select Subcategory</option>
          </select>

          <!-- Inputs -->
          <div class="grid grid-cols-2 gap-4">
            <input type="text" placeholder="First Name"
              class="bg-[#F6F4EF] p-3 rounded-md text-sm focus:outline-none" />
            <input type="text" placeholder="Last Name" class="bg-[#F6F4EF] p-3 rounded-md text-sm focus:outline-none" />
            <input type="email" placeholder="Email" class="bg-[#F6F4EF] p-3 rounded-md text-sm focus:outline-none" />
            <input type="text" placeholder="Phone Number"
              class="bg-[#F6F4EF] p-3 rounded-md text-sm focus:outline-none" />
          </div>

          <!-- File Upload -->
          <label class="block w-full bg-[#F6F4EF] p-3 rounded-md text-sm text-[#836054] cursor-pointer">
            Upload a file
            <input type="file" class="hidden" />
          </label>

          <!-- Message -->
          <textarea placeholder="Tell us more"
            class="w-full bg-[#F6F4EF] p-3 rounded-md text-sm h-28 resize-none focus:outline-none"></textarea>

          <!-- Submit -->
          <button type="button"
            class="w-full bg-[#836054] hover:bg-[#704832] text-white font-bold py-3 rounded-md transition">
            SUBMIT
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
