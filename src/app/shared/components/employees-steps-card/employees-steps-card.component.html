<div
  class="relative bg-white rounded-3xl border border-[#d9d3cc] shadow-2xl py-8 px-6 min-h-[300px] min-w-[300px] text-center"
>
  <!-- Number Circle -->
  <div class="relative w-14 h-14 mx-auto mb-8">
    <!-- Background Accent Circle -->
    <div
      class="absolute -bottom-2 -right-2 w-10 h-10 bg-[#efd3a6] rounded-full"
    ></div>

    <!-- Main Circle -->
    <div
      class="relative w-14 h-14 rounded-full border-2 border-[#7b5647] flex items-center justify-center text-xl font-semibold text-[#7b5647] bg-white"
    >
      {{ stepNumber }}
    </div>
  </div>

  <!-- Title -->
  <h3 class="text-2xl font-semibold text-[#2d1b14] mb-6">
    {{ title }}
  </h3>

  <!-- Description -->
  <p class="text-[#4a3a33] leading-relaxed text-md">
    {{ description }}
  </p>
</div>
