

<div class="flex min-h-[200px]items-center justify-center p-6">
  <div
    class="relative w-full max-w-[520px] overflow-hidden
           rounded-[60px]
           border-x-[3px] border-[#b89b74]
           bg-[#fcebc9]
           px-10 py-24

           before:absolute before:top-[-120px] before:left-[-15%]
           before:h-[220px] before:w-[130%]
           before:rounded-[50%]
           before:border-b-[3px] before:border-[#b89b74]
           before:bg-white before:content-['']

           after:absolute after:bottom-[-120px] after:left-[-15%]
           after:h-[220px] after:w-[130%]
           after:rounded-[50%]
           after:border-t-[3px] after:border-[#b89b74]
           after:bg-white after:content-['']

           shadow-[inset_0_0_40px_rgba(166,139,109,0.15)]"
  >
    <!-- Content Layer -->
    <div class="relative z-10 flex flex-col items-center text-center text-[#2c2c2c] mt-[20px] mb-[20px]">

      <h2 class="mb-3 text-2xl leading-tight font-medium md:text-3xl ">
        {{ title }}

      </h2>

      <h3 class="mb-6 text-lg font-normal italic opacity-90 md:text-xl">
        {{ subtitle }}
      </h3>

      <p class="text-base leading-relaxed text-gray-700 md:text-lg">
        {{ description }}
      </p>

    </div>
  </div>
</div>
