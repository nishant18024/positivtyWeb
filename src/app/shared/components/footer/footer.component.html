<footer class="bg-[#8b6a5c] text-[#fff4e6]">
  <div class="max-w-7xl mx-auto px-6 pt-14 pb-8">
    <!-- LOGO -->
    <div class="flex justify-center lg:justify-start mb-12">
      <img src="/assets/Logo.png" class="h-14" />
    </div>

    <!-- ================= DESKTOP ================= -->
    <div class="hidden lg:grid grid-cols-12 gap-8 text-sm">
      <div
        *ngFor="let section of footerSections; trackBy: trackByTitle"
        class="col-span-3"
      >
        <h4 class="text-lg font-semibold mb-5">
          {{ section.title }}
        </h4>

        <ul class="space-y-3">
          <li *ngFor="let link of section.links">
            <a
              [routerLink]="link.url"
              [fragment]="link.fragment"
              class="hover:text-white transition-colors duration-300"
            >
              {{ link.label }}
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- ================= MOBILE ACCORDION ================= -->
    <div class="lg:hidden space-y-4 text-sm">
      <div *ngFor="let section of footerSections; let i = index">
        <button
          (click)="toggle(i)"
          class="w-full flex justify-between items-center text-left font-semibold text-base py-2"
        >
          {{ section.title }}

          <span
            class="transition-transform duration-300"
            [class.rotate-180]="openIndex === i"
          >
            <i class="fa-solid fa-angle-down"></i>
          </span>
        </button>

        <div *ngIf="openIndex === i" class="mt-3 space-y-2 text-white/90">
          <a
            *ngFor="let link of section.links"
            [routerLink]="link.url"
            [fragment]="link.fragment"
            class="block hover:text-white"
          >
            {{ link.label }}
          </a>
        </div>
      </div>
    </div>

    <!-- ================= SOCIAL + COPYRIGHT ================= -->
    <div class="border-t border-white/20 mt-14 pt-6">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        <!-- SOCIAL ICONS -->
        <div class="flex gap-4">
          <a
            *ngFor="let social of socialLinks"
            href="#"
            [attr.aria-label]="social.label"
            class="bg-[#f6e6cf] text-[#8b6a5c] w-9 h-9 rounded-full flex items-center justify-center hover:bg-white hover:scale-110 transition-all duration-300"
          >
            <i class="fa-brands" [ngClass]="social.icon"></i>
          </a>
        </div>

        <!-- COPYRIGHT -->
        <p class="text-xs text-white/90 text-center md:text-right">
          © {{ currentYear }} Positivty. All rights reserved.
        </p>
      </div>
    </div>
  </div>
</footer>
