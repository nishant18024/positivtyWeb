<div
  class="relative bg-[#f4efe8] border border-[#c9a76a] rounded-md p-8 text-center shadow-sm hover:shadow-md transition-all duration-300 min-h-[360px]"
>
  <h3 class="text-lg md:text-xl font-semibold text-[#3f2d2a] mb-4">
    {{ title }}
  </h3>

  <p class="text-gray-700 leading-relaxed text-sm md:text-base mb-2">
    {{ description }}
  </p>

  <!-- Bottom Wave -->
  <div class="absolute bottom-0 left-0 w-full">
    <svg viewBox="0 0 500 60" preserveAspectRatio="none" class="w-full h-12">
      <path d="M0,30 C150,80 350,-20 500,30 L500,60 L0,60 Z" fill="#7a5b50" />
    </svg>
  </div>
</div>
