<section class="w-full flex justify-center px-4 py-4">
  <div
    class="relative max-w-6xl w-full rounded-3xl overflow-hidden flex flex-col md:flex-row bg-[#fed591]"
  >
    <!-- Left Image Section -->
    <div class="relative md:w-1/4 pt-10 flex items-end justify-center">
      <!-- Curved Background Shape -->
      <div class="absolute inset-0 bg-[#8a6557] rounded-tr-[200px]"></div>

      <!-- Image -->
      <img
        [src]="data.image"
        alt="testimonial"
        class="relative z-10 w-38 md:w-48 object-contain"
      />

      <!-- Decorative Hearts -->
      <div class="absolute top-10 left-6 text-white text-3xl opacity-70">♡</div>
      <div class="absolute top-20 right-8 text-white text-3xl opacity-70">
        ♡
      </div>
    </div>

    <!-- Right Content -->
    <div class="md:w-2/3 p-8 md:p-10 flex flex-col justify-center">
      <h2
        class="text-2xl md:text-4xl font-semibold text-[#7a4e3c] mb-4"
      >
        {{ data.title }}
      </h2>

      <p class="text-md leading-relaxed text-[#3e2a22] mb-4">
        "{{ data.message }}"
      </p>

      <p class="font-semibold text-[#7a4e3c]">
        — {{ data.author }}, {{ data.role }}
      </p>
    </div>
  </div>
</section>
