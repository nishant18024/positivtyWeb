<div
  class="relative bg-[#f9f8f8] rounded-bl-4xl rounded-tr-4xl p-4 shadow-[20px_20px_20px_rgba(0,0,0,0.12)] md:p-6 overflow-hidden max-w-md"
>
  <!-- watermark icon -->
  <div class="absolute right-0 top-auto">
    <img
      src="https://www.positivty.com/assets/img/Path%203%20(9).svg"
      alt=""
      class="w-30 h-32"
    />
  </div>

  <!-- content -->
  <div class="relative z-10">
    <div class="flex items-center gap-3 mb-4">
      <span class="text-[#6b4a3d] text-lg">✺</span>
      <h3 class="text-xl font-semibold text-[#3b2a22]">
        {{ title }}
      </h3>
    </div>

    <p class="text-sm text-[#6b5b52] mb-8">
      {{ description }}
    </p>
  </div>
</div>
