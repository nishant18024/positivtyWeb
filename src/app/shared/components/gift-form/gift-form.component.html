<form [formGroup]="giftForm" class="max-w-6xl mx-auto p-8 md:p-12 rounded-[40px] shadow-sm border border-[#e8dfd1]"
  style="background-color: rgba(254, 213, 145, 0.1);">
  <h2 class="text-4xl text-[#4e342e] mb-8">Recipients Details :</h2>

  <!-- Grid -->
  <div class="grid md:grid-cols-2 gap-x-10 gap-y-6">
    <!-- First Name -->
    <div>
      <label class="block text-[#4e342e] font-medium text-sm mb-2">First Name <span
          class="text-red-500">*</span></label>
      <input formControlName="firstName"
        class="w-full px-5 py-4 rounded-xl border border-[#e8dfd1] bg-white text-[#4e342e] placeholder-[#a69688] outline-none focus:border-[#7b5a4a] focus:ring-1 focus:ring-[#7b5a4a] transition-all"
        placeholder="First Name" />
      <app-form-error [controlName]="'firstName'"></app-form-error>
    </div>

    <!-- Last Name -->
    <div>
      <label class="block text-[#4e342e] font-medium text-sm mb-2">Last Name <span class="text-red-500">*</span></label>
      <input formControlName="lastName"
        class="w-full px-5 py-4 rounded-xl border border-[#e8dfd1] bg-white text-[#4e342e] placeholder-[#a69688] outline-none focus:border-[#7b5a4a] focus:ring-1 focus:ring-[#7b5a4a] transition-all"
        placeholder="Last Name" />
      <app-form-error [controlName]="'lastName'"></app-form-error>
    </div>

    <!-- Phone -->
    <div class="relative phone-input-container">
      <label class="block text-[#4e342e] font-medium text-sm mb-2">Contact Number <span
          class="text-red-500">*</span></label>
      <input id="giftPhone" appIntlTelInput formControlName="phone"
        class="w-full px-5 py-4 rounded-xl border border-[#e8dfd1] bg-white text-[#4e342e] placeholder-[#a69688] outline-none focus:border-[#7b5a4a] focus:ring-1 focus:ring-[#7b5a4a] transition-all"
        placeholder="Contact no" />
      <app-form-error [controlName]="'phone'"></app-form-error>
    </div>

    <!-- Email -->
    <div>
      <label class="block text-[#4e342e] font-medium text-sm mb-2">Email ID <span class="text-red-500">*</span></label>
      <input formControlName="email"
        class="w-full px-5 py-4 rounded-xl border border-[#e8dfd1] bg-white text-[#4e342e] placeholder-[#a69688] outline-none focus:border-[#7b5a4a] focus:ring-1 focus:ring-[#7b5a4a] transition-all"
        placeholder="someone@yourdomain.com" />
      <app-form-error [controlName]="'email'"></app-form-error>
    </div>

    <!-- Relationship -->
    <div class="relative">
      <label class="block text-[#4e342e] font-medium text-sm mb-2">Your Relationship with Recipient</label>
      <div class="relative">
        <select formControlName="relationship"
          class="w-full appearance-none px-5 py-4 rounded-xl border border-[#e8dfd1] bg-white text-[#a69688] outline-none focus:border-[#7b5a4a] focus:ring-1 focus:ring-[#7b5a4a] transition-all"
          [class.text-[#4e342e]]="giftForm.get('relationship')?.value">
          <option value="" disabled selected>Select your relationship</option>
          <option>Friend</option>
          <option>Family</option>
          <option>Colleague</option>
          <option>Others</option>
        </select>
        <div class="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none">
          <i class="fa-solid fa-chevron-down text-xs text-[#4e342e]"></i>
        </div>
      </div>
      <app-form-error [controlName]="'relationship'"></app-form-error>
    </div>

    <!-- Identity Toggle -->
    <div>
      <label class="block text-[#4e342e] font-medium text-sm mb-4">
        Do you want this person to know who you are?
      </label>
      <div class="flex items-center">
        <div (click)="toggleIdentity()"
          class="relative w-16 h-7 rounded-full cursor-pointer transition-colors duration-300" [style.backgroundColor]="
            giftForm.value.showIdentity === 'yes' ? '#836054' : '#c4b5a6'
          ">
          <div
            class="absolute top-1/2 -translate-y-1/2 bg-white w-5 h-5 rounded-full shadow-sm transition-all duration-300 flex items-center justify-center"
            [style.left]="
              giftForm.value.showIdentity === 'yes' ? '40px' : '4px'
            "></div>
          <span class="absolute text-[10px] font-bold uppercase select-none transition-all duration-300" [style.left]="
              giftForm.value.showIdentity === 'yes' ? '10px' : '30px'
            " [style.color]="'white'">
            {{ giftForm.value.showIdentity === "yes" ? "Yes" : "No" }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Message -->
  <div class="mt-8">
    <label class="block text-[#4e342e] font-medium text-sm mb-2">Message</label>
    <textarea formControlName="message" rows="4"
      class="w-full px-5 py-4 rounded-xl border border-[#e8dfd1] bg-white text-[#4e342e] placeholder-[#a69688] outline-none focus:border-[#7b5a4a] focus:ring-1 focus:ring-[#7b5a4a] transition-all resize-none"
      placeholder="Leave a Message"></textarea>
  </div>

  <!-- Amount -->
  <div class="mt-8">
    <label class="block text-[#4e342e] font-medium text-sm mb-2">Select Amount <span
        class="text-red-500">*</span></label>
    <div class="relative max-w-md">
      <select formControlName="amount"
        class="w-full appearance-none px-5 py-4 rounded-xl border border-[#e8dfd1] bg-white text-[#a69688] outline-none focus:border-[#7b5a4a] focus:ring-1 focus:ring-[#7b5a4a] transition-all"
        [class.text-[#4e342e]]="giftForm.get('amount')?.value">
        <option value="" disabled selected>Select Amount</option>
        <option value="50">₹50</option>
        <option value="100">₹100</option>
        <option value="200">₹200</option>
      </select>
      <div class="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none">
        <i class="fa-solid fa-chevron-down text-xs text-[#4e342e]"></i>
      </div>
    </div>
    <app-form-error [controlName]="'amount'"></app-form-error>
  </div>

  <!-- Footer -->
  <div class="flex items-end justify-between mt-12">
    <button type="button" (click)="openReviewModal()"
      class="bg-[#836054] text-white px-14 py-4 rounded-full text-sm font-semibold tracking-wide hover:bg-[#6d4f45] transition-colors shadow-md shadow-[#836054]/20 uppercase">
      SUBMIT
    </button>

    <a href="#" class="text-[#7b5a4a] text-sm hover:underline font-medium">Raise an Issue?</a>
  </div>
</form>

<!-- ================= MODAL ================= -->

<div *ngIf="showReviewModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-white rounded-3xl w-[90%] max-w-xl p-8 animation:scaleIn 0.25s ease-out">
    <h2 class="text-2xl text-center mb-6">Review</h2>

    <div class="border border-dashed rounded-xl p-5 bg-[#fff3e0] space-y-2">
      <div class="flex justify-space-between gap-4">
        <div class="space-y-2">
          <p class="text-sm text-[#8b5e4b]">
            👤 {{ giftForm.value.firstName }} {{ giftForm.value.lastName }}
          </p>
          <p class="text-sm text-[#8b5e4b]">📧 {{ giftForm.value.email }}</p>
        </div>
        <div class="space-y-2">
          <p class="text-sm text-[#8b5e4b]">📞 {{ giftForm.value.phone }}</p>
          <p class="text-sm text-[#8b5e4b]">💰 ₹{{ giftForm.value.amount }}</p>
        </div>
      </div>
      <p class="text-sm text-[#8b5e4b]">
        💬 {{ giftForm.value.message || "-" }}
      </p>
    </div>

    <div class="flex justify-between mt-8">
      <button (click)="closeReviewModal()"
        class="border border-[#8b5e4b] text-[#8b5e4b] px-6 py-2 rounded-full hover:bg-[#8b5e4b] hover:text-white transition">
        MODIFY
      </button>

      <button (click)="confirmAndPay()" class="bg-[#8b5e4b] text-white px-6 py-2 rounded-full">
        CONFIRM AND PAY
      </button>
    </div>
  </div>
</div>
