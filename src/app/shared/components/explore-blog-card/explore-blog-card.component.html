<div
  class="w-[300px] rounded-[40px_0] overflow-hidden shadow-xl border-2 border-[#c9a96e]"
  style="font-family: &quot;Lora&quot;, Georgia, serif"
>
  <!-- Image -->
  <div class="w-full h-48 overflow-hidden">
    <img
      [src]="imageSrc"
      [alt]="imageAlt"
      class="w-full h-full object-cover object-top"
    />
  </div>

  <!-- Content -->
  <div
    class="px-6 pt-6 pb-8 flex flex-col items-center text-center"
    style="background: linear-gradient(180deg, #4a2c18 0%, #2a1509 100%)"
  >
    <!-- Title -->
    <h3 class="text-white font-bold text-lg mb-4 tracking-wide">
      {{ title }}
    </h3>

    <!-- Description -->
    <p class="text-white/80 text-sm leading-relaxed mb-8">
      {{ description }}
    </p>

    <!-- Button -->
    <button
      (click)="onBrowse()"
      class="bg-white hover:scale-105 border-2 border-[#c1afa9] text-[#2a1509] text-sm font-medium px-6 py-1.5 rounded-full backdrop-blur-sm transition-all duration-200 tracking-wide cursor-pointer"
    >
      {{ buttonLabel }}
    </button>
  </div>
</div>
