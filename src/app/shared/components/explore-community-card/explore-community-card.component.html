<div class="relative w-full max-w-xl mx-auto">
  <!-- Background Shape Image -->
  <img
    src="https://www.positivty.com/assets/website/assets/images/support-group/Rectangle%2018228@2x.png"
    alt="Card Shape"
    class="w-full h-[560px] block"
  />

  <!-- Content Overlay -->
  <div
    class="absolute inset-0 flex flex-col items-center justify-center px-6 md:px-10 text-center"
  >
    <!-- Top Image -->
    <div class="mb-4 px-4 md:mt-4 flex justify-center">
      <img
        [src]="imageSrc"
        [alt]="imageAlt"
        class="rounded-2xl w-full max-w-xs h-[100px] md:h-[150px] object-cover shadow-md"
      />
    </div>

    <!-- Title -->
    <h3 class="text-xl font-semibold text-[#7b4f3c] mb-2">
      {{ title }}
    </h3>

    <!-- Description -->
    <p class="text-[#3e2a23] text-sm leading-relaxed mb-4 px-6">
      {{ description }}
    </p>

    <!-- Button -->
    <a
      [routerLink]="buttonLink"
      class="inline-block px-6 py-2 rounded-full border-2 border-[#b7a39c] text-[#7b4f3c] font-medium hover:bg-[#7b4f3c] hover:text-white transition duration-300"
    >
      {{ buttonLabel }}
    </a>
  </div>
</div>
