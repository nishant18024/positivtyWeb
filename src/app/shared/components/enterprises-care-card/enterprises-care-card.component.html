<section class="relative py-10 px-6">
  <div class="max-w-4xl mx-auto relative">
    <!-- Left Decorative Line -->
    <div
      class="absolute -left-6 top-4 my-auto hidden md:flex flex-col items-center"
    >
      <div class="w-1 h-46 bg-[#e7b86a] rounded-full relative">
        <div
          class="absolute top-8 -left-1.5 w-4 h-10 bg-[#7b5647] rounded-full"
        ></div>
      </div>
    </div>

    <!-- Main Card -->
    <div
      class="relative bg-[#e9e9e9] border-2 border-[#7b5647] rounded-3xl px-8 pt-8 pb-12 shadow-[8px_8px_0px_#e7b86a]"
    >
      <!-- Icon Circle -->
      <div
        class="absolute -top-12 left-8 rounded-full bg-[#fef2dd] p-3 border-b-2 border-[#7b5647]"
      >
        <div class="relative w-20 h-20">
          <!-- Back Circle -->
          <div
            class="absolute top-1 left-1.5 w-full h-full bg-[#fed591] rounded-full"
          ></div>

          <!-- Front Circle -->
          <div
            class="absolute inset-0 bg-[#7b5647] rounded-full flex items-center justify-center shadow-md"
          >
            <img
              *ngIf="icon"
              [src]="icon"
              alt="feature icon"
              class="w-10 h-10 object-contain"
            />
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="text-center md:text-right mt-8 md:mt-0">
        <h2 class="text-2xl font-semibold text-[#2d1b14] mb-6">
          {{ title }}
        </h2>

        <p
          class="text-md text-[#3b2a22] leading-relaxed max-w-2xl mx-auto md:ml-auto"
        >
          {{ description }}
        </p>
      </div>
    </div>
  </div>
</section>
